<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <!-- Badge Icon Container -->
  <g transform="translate(10, 8)">
    <circle cx="32" cy="32" r="30" fill="#0f4936" />
    <circle cx="32" cy="32" r="27" stroke="#e8d8c2" stroke-width="1.5" stroke-dasharray="3 2" />
    <!-- Traditional Arabic Dallah / Chai Finjan Icon -->
    <path d="M22 43 C22 47, 42 47, 42 43 L40 33 C40 31, 24 31, 24 33 Z" fill="#e8d8c2" />
    <!-- Saucer / Base -->
    <path d="M19 46 C19 48, 45 48, 45 46 Z" fill="#c76b2b" />
    <!-- Handle -->
    <path d="M40 34 C46 34, 46 41, 39 42" stroke="#e8d8c2" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <!-- Teapot spout / Lid -->
    <path d="M32 23 L32 20 C32 19, 32 19, 32 19" stroke="#c76b2b" stroke-width="3" stroke-linecap="round" />
    <path d="M26 30 C26 27, 38 27, 38 30 Z" fill="#c76b2b" />
    <!-- Rising Steam Swirls -->
    <path d="M28 22 C27 18, 30 17, 29 13" stroke="#e8d8c2" stroke-width="1.5" stroke-linecap="round" opacity="0.85" />
    <path d="M33 22 C35 18, 32 16, 34 11" stroke="#e8d8c2" stroke-width="1.5" stroke-linecap="round" opacity="0.85" />
    <circle cx="32" cy="18" r="1.5" fill="#f4a261" />
  </g>

  <!-- Typography -->
  <text x="82" y="34" font-family="'DM Sans', 'Cinzel', serif, sans-serif" font-size="20" font-weight="800" fill="#0f4936" letter-spacing="1.2">ARAB CHAI</text>
  <text x="82" y="50" font-family="'DM Sans', sans-serif" font-size="11" font-weight="600" fill="#c76b2b" letter-spacing="2.5">CAFE &amp; RESTAURANT</text>
  <text x="82" y="65" font-family="'DM Sans', sans-serif" font-size="9.5" font-weight="500" fill="#77716b" letter-spacing="0.5">AL MINA • DUBAI • EST. 2023</text>
</svg>
